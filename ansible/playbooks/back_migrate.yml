---
- name: Execute Proxmox workload back-migration plan
  hosts: "{{ groups[target_cluster] | first }}"
  gather_facts: false
  connection: local

  vars:
    migration_plan_file: "{{ playbook_dir | dirname | dirname }}/runstate/migration_plan.json"

  tasks:
    - name: Load migration plan JSON
      ansible.builtin.slurp:
        src: "{{ migration_plan_file }}"
      register: migration_plan_raw

    - name: Parse migration plan JSON
      ansible.builtin.set_fact:
        migration_plan_data: "{{ migration_plan_raw.content | b64decode | from_json }}"

    - name: Show back-migration summary
      ansible.builtin.debug:
        msg: "Migrating {{ migration_plan_data.migration_plan | length }} workloads back to {{ migration_plan_data.update_node }}"

    - name: Wait for Proxmox API to be available
      ansible.builtin.wait_for:
        host: "{{ migration_plan_data.update_node }}"
        port: 8006
        timeout: 600
        delay: 10
      delegate_to: localhost

    - name: Build back-migration batches
      ansible.builtin.set_fact:
        migration_batches: "{{ migration_plan_data.migration_plan | batch(4) | list }}"

    - name: Run workload back-migration batches
      ansible.builtin.include_tasks: migrate_batch.yml
      vars:
        reverse: true
      loop: "{{ migration_batches }}"
      loop_control:
        loop_var: migration_batch

    - name: Wait for workloads to return to original node
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: false
        status_code: 200
        return_content: true
      register: cluster_resources
      vars:
        planned_ids: "{{ migration_plan_data.migration_plan | map(attribute='vmid') | map('string') | list }}"
        returned_planned_ids: >-
          {{
            cluster_resources.json.data
            | selectattr('node', 'equalto', migration_plan_data.update_node)
            | map(attribute='vmid')
            | map('string')
            | select('in', planned_ids)
            | list
          }}
      until: returned_planned_ids | length == planned_ids | length
      retries: 2880
      delay: 10

    - name: Show back-migration completed
      ansible.builtin.debug:
        msg: "Back-migration completed. Planned workloads are back on {{ migration_plan_data.update_node }}"

    - name: Show completed back-migrations
      ansible.builtin.debug:
        msg: "{{ item.type | upper }} {{ item.vmid }} migrated back from {{ item.destination_node }} to {{ item.source_node }}"
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.type | upper }} {{ item.name }} / VMID {{ item.vmid }}"