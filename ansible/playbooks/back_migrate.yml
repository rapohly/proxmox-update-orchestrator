---
- name: Execute Proxmox VM back-migration plan
  hosts: api_host
  gather_facts: false
  connection: local

  vars:
    migration_plan_file: "/home/rpohly/projects/proxmox-update-orchestrator/output/migration_plan.json"

  tasks:
    - name: Load migration plan JSON
      ansible.builtin.slurp:
        src: "{{ migration_plan_file }}"
      register: migration_plan_raw

    - name: Parse migration plan JSON
      ansible.builtin.set_fact:
        migration_plan_data: "{{ migration_plan_raw.content | b64decode | from_json }}"

    - name: Show back-migration summary
      ansible.builtin.debug:
        msg: "Migrating {{ migration_plan_data.migration_plan | length }} VMs back to {{ migration_plan_data.update_node }}"

    - name: Start VM back-migrations
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/nodes/{{ item.destination_node }}/qemu/{{ item.vmid }}/migrate"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        body_format: form-urlencoded
        body:
          node: "{{ item.destination_node }}"
          target: "{{ item.source_node }}"
          vmid: "{{ item.vmid }}"
          online: 1
          with-local-disks: 1
        validate_certs: false
        status_code: 200
        return_content: true
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.name }} / VMID {{ item.vmid }}"
      register: back_migration_start_results

    - name: Wait for VMs to return to original node
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/nodes/{{ migration_plan_data.update_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: returned_vms
      retries: 2880
      delay: 10

      vars:
        planned_vmids: "{{ migration_plan_data.migration_plan | map(attribute='vmid') | list }}"

      until: >-
        {{
          (
            (
              returned_vms.json | default({}) | dict2items | items2dict
            ).data | default([])
            | map(attribute='vmid')
            | select('in', planned_vmids)
            | list
            | length
          )
          == (planned_vmids | length)
        }}
    - name: Show back-migration completed
      ansible.builtin.debug:
        msg: "Back-migration completed. Planned VMs are back on {{ migration_plan_data.update_node }}"

    - name: Show completed back-migrations
      ansible.builtin.debug:
        msg: "VM {{ item.vmid }} migrated back from {{ item.destination_node }} to {{ item.source_node }}"
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.name }} / VMID {{ item.vmid }}"