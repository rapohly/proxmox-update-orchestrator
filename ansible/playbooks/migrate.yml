---
- name: Execute Proxmox VM migration plan
  hosts: api_host
  gather_facts: false
  connection: local

  vars:
    migration_plan_file: "/home/rpohly/projects/proxmox-update-orchestrator/output/migration_plan.json"

  tasks:
    - name: Load migration plan JSON
      ansible.builtin.slurp:
        src: "{{ migration_plan_file }}"
      register: migration_plan_raw

    - name: Parse migration plan JSON
      ansible.builtin.set_fact:
        migration_plan_data: "{{ migration_plan_raw.content | b64decode | from_json }}"

    - name: Show migration plan summary
      ansible.builtin.debug:
        msg: "Evacuating {{ migration_plan_data.update_node }} with {{ migration_plan_data.migration_plan | length }} planned migrations"

    - name: Start VM migrations from plan
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/nodes/{{ item.source_node }}/qemu/{{ item.vmid }}/migrate"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        body_format: form-urlencoded
        body:
          node: "{{ item.source_node }}"
          target: "{{ item.destination_node }}"
          vmid: "{{ item.vmid }}"
          online: 1
          with-local-disks: 1
        validate_certs: false
        status_code: 200
        return_content: true
      throttle: 4
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.name }} / VMID {{ item.vmid }}"
      register: migration_start_results

    - name: Wait for update node to be evacuated
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/nodes/{{ migration_plan_data.update_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: false
        status_code: 200
        return_content: true
      register: remaining_vms
      vars:
        planned_vmids: "{{ migration_plan_data.migration_plan | map(attribute='vmid') | list }}"
        remaining_planned_vmids: >-
          {{
            remaining_vms.json.data
            | map(attribute='vmid')
            | select('in', planned_vmids)
            | list
          }}
      until: remaining_planned_vmids | length == 0
      retries: 2880
      delay: 10

    - name: Show evacuation completed
      ansible.builtin.debug:
        msg: "Evacuation completed for node {{ migration_plan_data.update_node }}"

    - name: Show completed planned migrations
      ansible.builtin.debug:
        msg: "VM {{ item.vmid }} migrated from {{ item.source_node }} to {{ item.destination_node }}"
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.name }} / VMID {{ item.vmid }}"