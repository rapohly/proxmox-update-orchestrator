---
- name: Execute Proxmox workload migration plan
  hosts: "{{ groups[inventory_group] | first }}"
  gather_facts: false
  connection: local

  vars:
    migration_plan_file: "{{ playbook_dir | dirname | dirname }}/runstate/migration_plan.json"

  tasks:
    - name: Load migration plan JSON
      ansible.builtin.slurp:
        src: "{{ migration_plan_file }}"
      register: migration_plan_raw

    - name: Parse migration plan JSON
      ansible.builtin.set_fact:
        migration_plan_data: "{{ migration_plan_raw.content | b64decode | from_json }}"

    - name: Show migration plan summary
      ansible.builtin.debug:
        msg: "Evacuating {{ migration_plan_data.update_node }} with {{ migration_plan_data.migration_plan | length }} planned migrations"

    - name: Build migration batches
      ansible.builtin.set_fact:
        migration_batches: "{{ migration_plan_data.migration_plan | batch(4) | list }}"

    - name: Run workload migration batches
      ansible.builtin.include_tasks: migrate_batch.yml
      vars:
        reverse: false
      loop: "{{ migration_batches }}"
      loop_control:
        loop_var: migration_batch

    - name: Wait for update node to be evacuated
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: false
        status_code: 200
        return_content: true
      register: cluster_resources
      vars:
        planned_ids: "{{ migration_plan_data.migration_plan | map(attribute='vmid') | map('string') | list }}"
        remaining_planned_ids: >-
          {{
            cluster_resources.json.data
            | selectattr('node', 'equalto', migration_plan_data.update_node)
            | map(attribute='vmid')
            | map('string')
            | select('in', planned_ids)
            | list
          }}
      until: remaining_planned_ids | length == 0
      retries: 2880
      delay: 10

    - name: Show evacuation completed
      ansible.builtin.debug:
        msg: "Evacuation completed for node {{ migration_plan_data.update_node }}"

    - name: Show completed planned migrations
      ansible.builtin.debug:
        msg: "{{ item.type | upper }} {{ item.vmid }} migrated from {{ item.source_node }} to {{ item.destination_node }}"
      loop: "{{ migration_plan_data.migration_plan }}"
      loop_control:
        label: "{{ item.type | upper }} {{ item.name }} / VMID {{ item.vmid }}"